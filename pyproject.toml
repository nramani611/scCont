[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sccont"
version = "0.1.0"
description = "Unsupervised contrastive learning of interpretable latent features from time-course scRNA-seq data"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Neal Kewalramani", email = "nramani@bu.edu" }]
keywords = ["single-cell", "scRNA-seq", "contrastive learning", "SHAP", "EMT", "deep learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "scanpy>=1.9",
    "anndata>=0.9",
    "torch>=2.0",
    "shap>=0.44",
    "matplotlib>=3.7",
    "tqdm>=4.60",
]

[project.optional-dependencies]
preprocess = ["scrublet>=0.2.3"]
annotation = ["gprofiler-official>=1.0", "openpyxl>=3.1"]
all = ["sccont[preprocess,annotation]"]
dev = ["pytest>=7", "build", "twine"]

[project.urls]
Homepage = "https://github.com/nramani611/scCont"
Repository = "https://github.com/nramani611/scCont"
Issues = "https://github.com/nramani611/scCont/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
